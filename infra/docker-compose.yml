version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: casino-platform-db
    environment:
      POSTGRES_DB: casino_platform
      POSTGRES_USER: casino_admin
      POSTGRES_PASSWORD: casino_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino_admin -d casino_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
